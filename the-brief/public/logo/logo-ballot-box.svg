<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .box { fill: #003D5C; }
      .fern { fill: #2F5233; }
      .slot { fill: #001F3F; }
      @media (prefers-color-scheme: dark) {
        .box { fill: #4A9ECC; }
        .fern { fill: #7BC67B; }
        .slot { fill: #000000; }
      }
    </style>
  </defs>
  
  <!-- Ballot box -->
  <rect class="box" x="140" y="220" width="232" height="200" rx="8"/>
  <rect class="box" x="120" y="190" width="272" height="40" rx="8"/>
  
  <!-- Slot -->
  <rect class="slot" x="220" y="195" width="72" height="8" rx="2"/>
  
  <!-- Emerging fern (growth from democracy) -->
  <g transform="translate(256, 180)">
    <!-- Stem -->
    <path class="fern" d="M 0,0 Q -2,-80 0,-150" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- Fronds -->
    <ellipse class="fern" cx="-35" cy="-120" rx="38" ry="16" transform="rotate(-48 -35 -120)"/>
    <ellipse class="fern" cx="35" cy="-115" rx="38" ry="16" transform="rotate(48 35 -115)"/>
    
    <ellipse class="fern" cx="-40" cy="-80" rx="42" ry="18" transform="rotate(-45 -40 -80)"/>
    <ellipse class="fern" cx="40" cy="-75" rx="42" ry="18" transform="rotate(45 40 -75)"/>
    
    <ellipse class="fern" cx="-42" cy="-40" rx="45" ry="20" transform="rotate(-42 -42 -40)"/>
    <ellipse class="fern" cx="42" cy="-35" rx="45" ry="20" transform="rotate(42 42 -35)"/>
  </g>
  
  <!-- Vote paper being inserted (optional detail) -->
  <rect class="box" x="235" y="150" width="42" height="60" rx="3" opacity="0.6" fill="#FFFFFF"/>
  <line x1="245" y1="165" x2="267" y2="165" stroke="#003D5C" stroke-width="2"/>
  <line x1="245" y1="175" x2="267" y2="175" stroke="#003D5C" stroke-width="2"/>
  <circle cx="242" cy="185" r="4" fill="#2F5233"/>
</svg>
