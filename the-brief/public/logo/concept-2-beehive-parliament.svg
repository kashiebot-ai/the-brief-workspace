<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Concept 2: Parliament Beehive Silhouette -->
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .logo-adaptive { fill: #ffffff; stroke: #ffffff; }
      }
      @media (prefers-color-scheme: light) {
        .logo-adaptive { fill: #1a1a1a; stroke: #1a1a1a; }
      }
    </style>
  </defs>
  
  <!-- Simplified Beehive dome shape -->
  <path class="logo-adaptive" d="M 100 40 Q 70 50, 60 80 Q 55 100, 60 120 L 60 140 L 140 140 L 140 120 Q 145 100, 140 80 Q 130 50, 100 40 Z" 
        fill="currentColor" stroke="none"/>
  
  <!-- Horizontal lines representing legislative text/layers -->
  <line x1="70" y1="70" x2="130" y2="70" stroke="white" stroke-width="2" opacity="0.3"/>
  <line x1="65" y1="85" x2="135" y2="85" stroke="white" stroke-width="2" opacity="0.3"/>
  <line x1="62" y1="100" x2="138" y2="100" stroke="white" stroke-width="2" opacity="0.3"/>
  <line x1="61" y1="115" x2="139" y2="115" stroke="white" stroke-width="2" opacity="0.3"/>
  <line x1="60" y1="130" x2="140" y2="130" stroke="white" stroke-width="2" opacity="0.3"/>
  
  <!-- Base structure -->
  <rect class="logo-adaptive" x="55" y="140" width="90" height="15" fill="currentColor"/>
  
  <!-- Text "THE BRIEF" below -->
  <text class="logo-adaptive" x="100" y="180" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="2">THE BRIEF</text>
</svg>
