  <line class="lines" x1="10" y1="12" x2="22" y2="12" stroke-width="1.5" opacity="0.4"/>
  <line class="lines" x1="9" y1="16" x2="23" y2="16" stroke-width="1.5" opacity="0.4"/>
  <line class="lines" x1="8" y1="20" x2="24" y2="20" stroke-width="1.5" opacity="0.4"/>
  <line class="lines" x1="8" y1="24" x2="24" y2="24" stroke-width="1.5" opacity="0.4"/>
</svg>
