<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Favicon: Beehive dome -->
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .icon { fill: #ffffff; }
        .lines { stroke: #000000; }
      }
      @media (prefers-color-scheme: light) {
        .icon { fill: #1a1a1a; }
        .lines { stroke: #ffffff; }
      }
    </style>
  </defs>
  
  <!-- Beehive shape -->
  <path class="icon" d="M 16 6 Q 10 8, 8 14 Q 7 18, 8 22 L 8 26 L 24 26 L 24 22 Q 25 18, 24 14 Q 22 8, 16 6 Z"/>
  
