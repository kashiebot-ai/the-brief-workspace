<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Logo 2: Geometric Brief/Fern -->
  <rect width="100" height="100" rx="16" fill="#1e3a5f"/>
  <!-- Stylized fern as document lines -->
  <path d="M20 30 L50 20 L80 30" stroke="#4a90a4" stroke-width="4" stroke-linecap="round"/>
  <path d="M25 45 L50 38 L75 45" stroke="#6b9eb0" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M30 60 L50 55 L70 60" stroke="#8eb2c1" stroke-width="3" stroke-linecap="round"/>
  <path d="M35 75 L50 72 L65 75" stroke="#b0c6d2" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center stem -->
  <line x1="50" y1="20" x2="50" y2="85" stroke="#c0c0c0" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom point -->
  <circle cx="50" cy="88" r="4" fill="#c0c0c0"/>
</svg>