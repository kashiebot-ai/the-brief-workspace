<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .primary { fill: #003D5C; }
      .accent { fill: #2F5233; }
      @media (prefers-color-scheme: dark) {
        .primary { fill: #FFFFFF; }
        .accent { fill: #7BC67B; }
      }
    </style>
  </defs>
  
  <!-- Circular background -->
  <circle cx="256" cy="256" r="240" class="primary" opacity="0.1"/>
  
  <!-- TB Monogram -->
  <g transform="translate(256, 256)">
    <!-- T -->
    <rect class="primary" x="-120" y="-100" width="100" height="30" rx="5"/>
    <rect class="primary" x="-55" y="-100" width="30" height="200" rx="5"/>
    
    <!-- B -->
    <path class="primary" d="M 30,-100 L 30,100 L 100,-100 Q 140,-100 140,-60 Q 140,-20 100,-20 L 30,-20 M 30,-20 L 100,-20 Q 150,-20 150,30 Q 150,80 100,100 L 30,100" 
          stroke-width="30" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Fern accent (negative space in B) -->
    <g opacity="0.3">
      <ellipse class="accent" cx="90" cy="-60" rx="15" ry="8" transform="rotate(30 90 -60)"/>
      <ellipse class="accent" cx="90" cy="-40" rx="15" ry="8" transform="rotate(-30 90 -40)"/>
      <ellipse class="accent" cx="95" cy="30" rx="18" ry="10" transform="rotate(35 95 30)"/>
      <ellipse class="accent" cx="95" cy="55" rx="18" ry="10" transform="rotate(-35 95 55)"/>
    </g>
  </g>
</svg>
