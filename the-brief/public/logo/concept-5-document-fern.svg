<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Variation 5: Document + Fern Hybrid -->
  <defs>
    <style>
      .primary { fill: #1E3A5F; }
      .accent { fill: #A8B8C8; }
      .fern { fill: #7FA99B; opacity: 0.6; }
      @media (prefers-color-scheme: dark) {
        .primary { fill: #A8B8C8; }
        .accent { fill: #6B7F95; }
        .fern { fill: #9DBFB3; opacity: 0.7; }
      }
    </style>
  </defs>
  
  <!-- Document/paper with corner fold -->
  <g class="primary">
    <!-- Main document -->
    <path d="M 140 120 L 372 120 L 372 140 L 350 140 L 372 162 L 372 400 L 140 400 Z" />
    
    <!-- Corner fold (lighter) -->
    <path d="M 350 140 L 372 140 L 372 162 Z" class="accent"/>
    
    <!-- Fold shadow -->
    <path d="M 350 140 L 372 162" stroke="#000" stroke-width="1.5" opacity="0.15" fill="none"/>
  </g>
  
  <!-- Fern watermark -->
  <g class="fern">
    <path d="M 256 180 Q 258 260 260 340" stroke-width="4" fill="none" stroke="currentColor"/>
    
    <!-- Small fronds -->
    <ellipse cx="245" cy="210" rx="18" ry="8" transform="rotate(-45 245 210)"/>
    <ellipse cx="267" cy="210" rx="18" ry="8" transform="rotate(45 267 210)"/>
    
    <ellipse cx="243" cy="245" rx="20" ry="9" transform="rotate(-40 243 245)"/>
    <ellipse cx="269" cy="245" rx="20" ry="9" transform="rotate(40 269 245)"/>
    
    <ellipse cx="242" cy="280" rx="22" ry="10" transform="rotate(-38 242 280)"/>
    <ellipse cx="270" cy="280" rx="22" ry="10" transform="rotate(38 270 280)"/>
    
    <ellipse cx="244" cy="315" rx="19" ry="9" transform="rotate(-40 244 315)"/>
    <ellipse cx="268" cy="315" rx="19" ry="9" transform="rotate(40 268 315)"/>
  </g>
  
  <!-- Typography -->
  <text x="256" y="465" font-family="Georgia, serif" font-size="44" font-weight="600" text-anchor="middle" class="primary">THE BRIEF</text>
</svg>
