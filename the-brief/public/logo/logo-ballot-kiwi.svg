<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .logo-primary { fill: #1e40af; }
      .logo-secondary { fill: #3b82f6; }
      .logo-accent { fill: #60a5fa; }
    </style>
  </defs>
  
  <!-- Ballot box -->
  <rect x="50" y="80" width="100" height="70" rx="3" class="logo-primary"/>
  <rect x="55" y="75" width="90" height="10" rx="2" class="logo-secondary"/>
  <path d="M100 55 L110 75 L90 75 Z" class="logo-secondary"/>
  
  <!-- Kiwi bird silhouette (simplified) -->
  <circle cx="100" cy="105" r="18" fill="#ffffff"/>
  <ellipse cx="100" cy="115" rx="12" ry="15" fill="#ffffff"/>
  <path d="M100 105 Q115 105 120 110" stroke="#1e40af" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="95" cy="102" r="2" fill="#1e40af"/>
  <path d="M105 120 L105 130" stroke="#1e40af" stroke-width="2" stroke-linecap="round"/>
  <path d="M95 122 L95 130" stroke="#1e40af" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Check mark -->
  <path d="M75 115 L82 122 L95 105" stroke="#60a5fa" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>