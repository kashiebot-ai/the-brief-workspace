<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .logo-primary { fill: #E0E0E0; stroke: #E0E0E0; }
        .logo-accent { fill: #A0A0A0; stroke: #A0A0A0; }
      }
      @media (prefers-color-scheme: light) {
        .logo-primary { fill: #2C3E50; stroke: #2C3E50; }
        .logo-accent { fill: #7F8C8D; stroke: #7F8C8D; }
      }
    </style>
  </defs>
  
  <!-- Parliamentary dome (simplified) -->
  <ellipse cx="100" cy="90" rx="45" ry="20" class="logo-primary" opacity="0.2"/>
  <path d="M 55 90 Q 100 50 145 90" stroke="currentColor" stroke-width="3" fill="none" class="logo-primary"/>
  
  <!-- Columns -->
  <rect x="70" y="90" width="8" height="50" class="logo-primary" opacity="0.8"/>
  <rect x="96" y="90" width="8" height="50" class="logo-primary"/>
  <rect x="122" y="90" width="8" height="50" class="logo-primary" opacity="0.8"/>
  
  <!-- Base -->
  <rect x="60" y="140" width="80" height="6" class="logo-primary"/>
  
  <!-- Abstract document fold beneath -->
  <path d="M 75 155 L 75 165 L 100 160 L 125 165 L 125 155 Z" class="logo-accent" opacity="0.6"/>
  <line x1="75" y1="155" x2="125" y2="155" stroke="currentColor" stroke-width="2" class="logo-accent"/>
</svg>
