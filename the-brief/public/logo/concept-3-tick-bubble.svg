<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Concept 3: Voting Tick + Speech Bubble -->
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .logo-adaptive { fill: none; stroke: #ffffff; }
        .logo-fill { fill: #ffffff; }
      }
      @media (prefers-color-scheme: light) {
        .logo-adaptive { fill: none; stroke: #1a1a1a; }
        .logo-fill { fill: #1a1a1a; }
      }
    </style>
  </defs>
  
  <!-- Speech bubble body -->
  <rect class="logo-adaptive" x="50" y="50" width="100" height="70" rx="15" stroke-width="3" fill="none"/>
  
  <!-- Speech bubble tail that forms the tick -->
  <path class="logo-adaptive" d="M 90 120 L 85 135 L 95 125" stroke-width="3" stroke-linejoin="round" fill="none"/>
  
  <!-- Check mark inside bubble -->
  <path class="logo-fill" d="M 75 85 L 88 98 L 118 65" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Text "THE BRIEF" below -->
  <text class="logo-fill" x="100" y="165" font-family="Arial, sans-serif" font-size="18" font-weight="500" text-anchor="middle">The Brief</text>
  <text class="logo-fill" x="100" y="182" font-family="Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle" opacity="0.7">NZ POLITICS</text>
</svg>
