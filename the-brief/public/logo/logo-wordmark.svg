<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <defs>
    <style>
      .logo-text { 
        fill: #1e40af; 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-weight: 700;
      }
      .logo-accent { fill: #3b82f6; }
    </style>
  </defs>
  
  <!-- "THE BRIEF" wordmark with political symbolism in negative space -->
  <text x="10" y="65" class="logo-text" font-size="48">THE</text>
  <text x="120" y="65" class="logo-text" font-size="48">BRIEF</text>
  
  <!-- Subtle fern frond in negative space between words -->
  <path d="M105 30 Q108 35 108 40 L108 45 Q108 50 105 55 L102 60" 
        stroke="#60a5fa" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <ellipse cx="110" cy="35" rx="3" ry="2" class="logo-accent" opacity="0.6"/>
  <ellipse cx="111" cy="42" rx="3" ry="2" class="logo-accent" opacity="0.6"/>
  <ellipse cx="110" cy="49" rx="2.5" ry="1.5" class="logo-accent" opacity="0.6"/>
  <ellipse cx="99" cy="37" rx="3" ry="2" class="logo-accent" opacity="0.6"/>
  <ellipse cx="97" cy="44" rx="3" ry="2" class="logo-accent" opacity="0.6"/>
  
  <!-- Underline with subtle vote checkmark -->
  <line x1="10" y1="75" x2="270" y2="75" stroke="#3b82f6" stroke-width="3"/>
  <path d="M265 70 L270 75 L275 65" stroke="#3b82f6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>