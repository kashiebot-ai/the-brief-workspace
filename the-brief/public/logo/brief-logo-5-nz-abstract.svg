<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .logo-primary { fill: #E0E0E0; stroke: #E0E0E0; }
        .logo-accent { fill: #A0A0A0; stroke: #A0A0A0; }
      }
      @media (prefers-color-scheme: light) {
        .logo-primary { fill: #2C3E50; stroke: #2C3E50; }
        .logo-accent { fill: #7F8C8D; stroke: #7F8C8D; }
      }
    </style>
  </defs>
  
  <!-- Abstract NZ map silhouette simplified -->
  <path d="M 100 50 L 120 75 L 125 100 L 115 130 L 105 145 L 100 140 L 95 150 L 85 125 L 80 100 L 90 70 Z" 
        class="logo-primary" opacity="0.15"/>
  
  <!-- Circular frame -->
  <circle cx="100" cy="100" r="50" stroke="currentColor" stroke-width="3" fill="none" class="logo-primary"/>
  
  <!-- Stylized fern unfurling from center -->
  <path d="M 100 100 Q 100 85 95 75" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none" class="logo-primary"/>
  
  <!-- Fern fronds (koru style) -->
  <path d="M 95 75 Q 90 73 88 75 Q 90 77 92 76" fill="currentColor" class="logo-accent"/>
  <path d="M 97 82 Q 93 81 91 83 Q 93 84 95 83" fill="currentColor" class="logo-accent" opacity="0.8"/>
  <path d="M 98 90 Q 94 89 93 91 Q 95 92 97 91" fill="currentColor" class="logo-accent" opacity="0.7"/>
  <path d="M 99 97 Q 96 96 95 98 Q 97 99 98 98" fill="currentColor" class="logo-accent" opacity="0.6"/>
  
  <!-- Document fold corner -->
  <path d="M 130 125 L 130 145 L 150 145 Z" class="logo-accent" opacity="0.3"/>
  <line x1="130" y1="145" x2="150" y2="125" stroke="currentColor" stroke-width="1" class="logo-accent" opacity="0.4"/>
</svg>
