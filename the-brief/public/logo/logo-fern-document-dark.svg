<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .logo-primary { fill: #60a5fa; }
      .logo-secondary { fill: #93c5fd; }
      .logo-accent { fill: #bfdbfe; }
    </style>
  </defs>
  
  <!-- Document/briefcase base -->
  <rect x="50" y="60" width="100" height="80" rx="4" class="logo-primary"/>
  <rect x="55" y="65" width="90" height="70" rx="2" fill="#1e293b"/>
  
  <!-- Silver fern leaf integrated -->
  <path d="M100 75 Q105 80 105 85 L105 90 Q105 95 100 100 L95 105 Q90 110 90 115 L90 120" 
        stroke="#60a5fa" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="108" cy="82" rx="4" ry="2.5" class="logo-secondary"/>
  <ellipse cx="110" cy="87" rx="4.5" ry="2.5" class="logo-secondary"/>
  <ellipse cx="108" cy="92" rx="4" ry="2.5" class="logo-secondary"/>
  <ellipse cx="105" cy="97" rx="3.5" ry="2" class="logo-accent"/>
  <ellipse cx="92" cy="85" rx="4" ry="2.5" class="logo-secondary"/>
  <ellipse cx="88" cy="90" rx="4.5" ry="2.5" class="logo-secondary"/>
  <ellipse cx="88" cy="95" rx="4" ry="2.5" class="logo-secondary"/>
  <ellipse cx="90" cy="100" rx="3.5" ry="2" class="logo-accent"/>
  
  <!-- Lines suggesting text on document -->
  <line x1="65" y1="110" x2="135" y2="110" stroke="#475569" stroke-width="2"/>
  <line x1="65" y1="118" x2="125" y2="118" stroke="#475569" stroke-width="2"/>
  <line x1="65" y1="126" x2="130" y2="126" stroke="#475569" stroke-width="2"/>
</svg>