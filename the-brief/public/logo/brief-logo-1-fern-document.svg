<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <style>
      @media (prefers-color-scheme: dark) {
        .logo-primary { fill: #E0E0E0; }
        .logo-accent { fill: #A0A0A0; }
      }
      @media (prefers-color-scheme: light) {
        .logo-primary { fill: #2C3E50; }
        .logo-accent { fill: #7F8C8D; }
      }
    </style>
  </defs>
  
  <!-- Document/Brief outline -->
  <rect x="60" y="40" width="80" height="120" rx="4" class="logo-primary" opacity="0.15"/>
  <rect x="60" y="40" width="80" height="120" rx="4" stroke="currentColor" stroke-width="3" fill="none" class="logo-primary"/>
  
  <!-- Horizontal lines representing text -->
  <line x1="75" y1="65" x2="125" y2="65" stroke="currentColor" stroke-width="2.5" class="logo-accent" opacity="0.6"/>
  <line x1="75" y1="80" x2="125" y2="80" stroke="currentColor" stroke-width="2.5" class="logo-accent" opacity="0.6"/>
  <line x1="75" y1="95" x2="110" y2="95" stroke="currentColor" stroke-width="2.5" class="logo-accent" opacity="0.6"/>
  
  <!-- Silver fern frond overlay -->
  <path d="M100 100 Q95 110 90 115 Q95 112 100 110 Q105 112 110 115 Q105 110 100 100" class="logo-primary" opacity="0.8"/>
  <path d="M100 110 Q95 118 92 122 Q96 120 100 118 Q104 120 108 122 Q105 118 100 110" class="logo-primary" opacity="0.7"/>
  <path d="M100 118 Q96 124 94 127 Q97 126 100 125 Q103 126 106 127 Q104 124 100 118" class="logo-primary" opacity="0.6"/>
  <path d="M100 125 Q97 129 96 131 Q98 130 100 130 Q102 130 104 131 Q103 129 100 125" class="logo-primary" opacity="0.5"/>
</svg>
